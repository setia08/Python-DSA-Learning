<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Python + DSA Interview Prep</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F5F8; --surface:#FFFFFF; --surface-2:#EBEFF5; --ink:#172033; --muted:#5A6579; --line:#D9DFE8;
  --accent:#2450C9; --accent-soft:#E4EBFC; --accent-ink:#FFFFFF; --mari:#C98A00; --mari-soft:#FBF0D3;
  --good:#137A4A; --good-bg:#E3F4EA; --bad:#B3261E; --bad-bg:#FBE7E5;
  --code-bg:#142036; --code-ink:#E4EAF4; --code-muted:#8291AB;
  --sans:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D131D; --surface:#141C29; --surface-2:#1B2534; --ink:#E6EBF2; --muted:#98A3B5; --line:#253144;
    --accent:#7C9DFF; --accent-soft:#1D2A4A; --accent-ink:#0D131D; --mari:#F0BE48; --mari-soft:#33290F;
    --good:#4CC38A; --good-bg:#12301F; --bad:#F28B82; --bad-bg:#3A1715;
    --code-bg:#0A1019; --code-ink:#E4EAF4; --code-muted:#7C8AA3; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D131D; --surface:#141C29; --surface-2:#1B2534; --ink:#E6EBF2; --muted:#98A3B5; --line:#253144;
  --accent:#7C9DFF; --accent-soft:#1D2A4A; --accent-ink:#0D131D; --mari:#F0BE48; --mari-soft:#33290F;
  --good:#4CC38A; --good-bg:#12301F; --bad:#F28B82; --bad-bg:#3A1715;
  --code-bg:#0A1019; --code-ink:#E4EAF4; --code-muted:#7C8AA3; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 72px); height:100%}
body{margin:0; background:var(--bg); color:var(--ink); font:16px/1.6 var(--sans); -webkit-font-smoothing:antialiased; min-height:100%}
a{color:var(--accent)}
code{font-family:var(--mono); font-size:.88em; background:var(--surface-2); padding:.08em .35em; border-radius:4px}
button{font:inherit; color:inherit; cursor:pointer}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:6px}
h1,h2,h3{line-height:1.25; margin:0}
h1{font-size:1.75rem; font-weight:600; letter-spacing:-.01em}
h2{font-size:1.2rem; font-weight:600}
h3{font-size:1rem; font-weight:600}
p{margin:.4em 0 .8em}
.muted{color:var(--muted)}
.small{font-size:.875rem}

/* ---------- layout ---------- */
.app{display:grid; grid-template-columns:268px minmax(0,1fr); min-height:100vh}
.side{position:sticky; top:0; height:100vh; overflow-y:auto; border-right:1px solid var(--line); background:var(--surface); padding:20px 14px 28px}
.brand{display:flex; align-items:baseline; gap:8px; padding:4px 10px 18px; text-decoration:none; color:var(--ink)}
.brand b{font-family:var(--mono); font-weight:600; font-size:1.05rem}
.brand span{color:var(--muted); font-size:.85rem}
.navgroup{margin:6px 0 16px}
.navgroup h4{margin:0 0 4px; padding:0 10px; font-size:.78rem; font-weight:600; color:var(--muted)}
.nav a{display:flex; justify-content:space-between; align-items:center; gap:8px; padding:7px 10px; border-radius:7px; color:var(--ink); text-decoration:none; font-size:.94rem}
.nav a:hover{background:var(--surface-2)}
.nav a.on{background:var(--accent-soft); color:var(--accent); font-weight:500}
.nav a .ct{font-family:var(--mono); font-size:.75rem; color:var(--muted)}
.nav a.on .ct{color:var(--accent)}
.sidefoot{margin-top:18px; padding:12px 10px 0; border-top:1px solid var(--line); font-size:.8rem; color:var(--muted)}

.top{position:sticky; top:0; z-index:20; background:color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); border-bottom:1px solid var(--line); padding:12px 28px; padding-top:calc(12px + env(safe-area-inset-top,0px)); top:0; display:flex; gap:12px; align-items:center}
.menu-btn{display:none; background:none; border:1px solid var(--line); border-radius:8px; padding:7px 10px}
.search{position:relative; flex:1; max-width:560px}
.search input{width:100%; font:inherit; font-size:.95rem; padding:9px 12px 9px 36px; border:1px solid var(--line); border-radius:9px; background:var(--surface); color:var(--ink)}
.search input:focus{outline:2px solid var(--accent); outline-offset:0; border-color:transparent}
.search svg{position:absolute; left:11px; top:50%; transform:translateY(-50%); color:var(--muted)}
.search kbd{position:absolute; right:10px; top:50%; transform:translateY(-50%); font-family:var(--mono); font-size:.72rem; color:var(--muted); border:1px solid var(--line); border-radius:4px; padding:0 5px}
.results{position:absolute; left:0; right:0; top:calc(100% + 6px); background:var(--surface); border:1px solid var(--line); border-radius:10px; box-shadow:0 12px 32px rgba(10,20,40,.16); max-height:60vh; overflow:auto; display:none}
.results.open{display:block}
.results a{display:block; padding:9px 14px; text-decoration:none; color:var(--ink); border-bottom:1px solid var(--line)}
.results a:last-child{border-bottom:0}
.results a:hover,.results a.sel{background:var(--surface-2)}
.results .rt{font-size:.75rem; color:var(--muted)}
.sync{font-size:.8rem; color:var(--muted); white-space:nowrap}

.main{min-width:0}
.content{max-width:900px; padding:28px 28px 80px; margin:0 auto}
.pagehead{margin:4px 0 22px}
.pagehead p{color:var(--muted); max-width:68ch; margin:.5em 0 0}

/* ---------- generic ---------- */
.btn{display:inline-flex; align-items:center; gap:6px; border:1px solid var(--line); background:var(--surface); padding:8px 14px; border-radius:8px; font-size:.92rem; text-decoration:none; color:var(--ink)}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent); border-color:var(--accent); color:var(--accent-ink); font-weight:500}
.btn.pri:hover{filter:brightness(1.07)}
.btn.good{border-color:var(--good); color:var(--good)}
.btn.bad{border-color:var(--bad); color:var(--bad)}
.btn[disabled]{opacity:.5; cursor:not-allowed}
.row{display:flex; flex-wrap:wrap; gap:8px; align-items:center}
.chips{display:flex; flex-wrap:wrap; gap:6px; margin:0 0 18px}
.chip{border:1px solid var(--line); background:var(--surface); border-radius:999px; padding:4px 12px; font-size:.85rem; color:var(--ink); text-decoration:none}
.chip.on{background:var(--ink); color:var(--surface); border-color:var(--ink)}
.tag{display:inline-block; font-size:.78rem; padding:1px 8px; border-radius:999px; background:var(--surface-2); color:var(--muted); text-decoration:none}
a.tag:hover{color:var(--accent)}
.lvl{font-size:.8rem; color:var(--muted); white-space:nowrap}
.hot{font-size:.8rem; color:var(--mari); font-weight:500; white-space:nowrap}
.status{font-size:.75rem; font-weight:500; padding:1px 8px; border-radius:999px; white-space:nowrap}
.status.ok{background:var(--good-bg); color:var(--good)}
.status.rev{background:var(--mari-soft); color:var(--mari)}

.panel{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:18px 20px; margin-bottom:16px}

/* question items */
.item{background:var(--surface); border:1px solid var(--line); border-radius:12px; margin-bottom:10px}
.item.open{border-color:color-mix(in srgb, var(--accent) 45%, var(--line))}
.ihead{width:100%; text-align:left; background:none; border:0; padding:15px 18px; display:grid; grid-template-columns:1fr auto; gap:6px 14px; align-items:start; border-radius:12px}
.ihead .qt{font-weight:500; font-size:1rem}
.ihead .meta{grid-column:1/-1; display:flex; flex-wrap:wrap; gap:6px 12px; align-items:center}
.ihead .chev{color:var(--muted); transition:transform .15s}
.item.open .chev{transform:rotate(90deg)}
.ibody{display:none; padding:0 18px 18px; border-top:1px solid var(--line)}
.item.open .ibody{display:block}
.sec{margin-top:16px}
.sec > h3{font-size:.85rem; font-weight:600; color:var(--muted); margin-bottom:4px}
.callout{border-left:3px solid var(--mari); background:var(--mari-soft); padding:10px 14px; border-radius:0 8px 8px 0}
.callout.bad{border-color:var(--bad); background:var(--bad-bg)}
.callout.good{border-color:var(--good); background:var(--good-bg)}
.hidden{display:none !important}
.reveal-bar{display:flex; flex-wrap:wrap; gap:8px; margin-top:14px; padding:12px; background:var(--surface-2); border-radius:9px; align-items:center}
.reveal-bar .hintline{flex-basis:100%; font-size:.88rem; color:var(--muted)}

/* code */
pre{margin:0}
.code{position:relative; background:var(--code-bg); color:var(--code-ink); border-radius:9px; margin:10px 0; overflow:hidden}
.code pre{padding:14px 16px; overflow-x:auto; font:13.5px/1.6 var(--mono); tab-size:4}
.code .copy{position:absolute; top:7px; right:7px; background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.14); color:var(--code-ink); border-radius:6px; font-size:.72rem; padding:3px 8px; opacity:.75}
.code .copy:hover{opacity:1}
.code .k{color:#8FB4FF}.code .s{color:#F2C97D}.code .c{color:var(--code-muted); font-style:italic}.code .n{color:#F5A48F}.code .b{color:#7FD1B9}.code .d{color:#D7A6FF}
.plain{background:var(--surface-2); border:1px solid var(--line); border-radius:9px; padding:12px 14px; font:13.5px/1.6 var(--mono); overflow-x:auto; white-space:pre}
.out{background:var(--surface-2); border-left:3px solid var(--good); border-radius:0 8px 8px 0; padding:10px 14px; font:13.5px/1.6 var(--mono); white-space:pre; overflow-x:auto}

.cx{display:flex; flex-wrap:wrap; gap:8px 18px; font-size:.9rem}
.cx b{font-family:var(--mono); font-weight:500}

/* dashboard readout */
.readout{background:var(--code-bg); color:var(--code-ink); border-radius:14px; padding:22px 24px; font-family:var(--mono); font-size:14px; overflow-x:auto}
.readout .rl{display:grid; grid-template-columns:minmax(150px,auto) auto 4.5ch; gap:16px; align-items:center; white-space:nowrap; padding:3px 0}
.readout .bar{color:#F0BE48; letter-spacing:1px}
.readout .bar i{color:#33405A; font-style:normal}
.readout .pc{text-align:right}
.readout .lab{color:#B8C3D6}
.readout hr{border:0; border-top:1px dashed #33405A; margin:10px 0}
.readout .total .lab{color:#fff; font-weight:600}
.readout .total .pc{color:#fff; font-weight:600}
.readout .rhead{color:#8291AB; margin-bottom:10px; white-space:normal}
.grid2{display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:16px; margin-top:16px}
.stat{font-family:var(--mono); font-size:1.5rem; font-weight:600}
.reclist{list-style:none; padding:0; margin:0}
.reclist li{padding:10px 0; border-bottom:1px solid var(--line); display:flex; gap:12px; justify-content:space-between; align-items:center}
.reclist li:last-child{border-bottom:0}
.minibars{display:flex; gap:6px; align-items:flex-end; height:64px; margin-top:8px}
.minibars div{flex:1; background:var(--accent); border-radius:4px 4px 0 0; min-height:3px; position:relative}
.minibars span{position:absolute; top:-18px; left:0; right:0; text-align:center; font-size:.7rem; color:var(--muted); font-family:var(--mono)}

/* tables */
.tbl{width:100%; border-collapse:collapse; font-size:.9rem}
.tbl th,.tbl td{text-align:left; padding:7px 10px; border-bottom:1px solid var(--line); vertical-align:top}
.tbl th{font-weight:600; color:var(--muted); font-size:.8rem}
.tbl td:first-child{font-family:var(--mono); font-size:.85rem}
.tblwrap{overflow-x:auto}
.cxgrid{display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:14px}
.finder td:first-child{font-family:var(--sans)}
.finder a{text-decoration:none; font-weight:500}

/* quiz */
.qprog{display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; font-size:.88rem; color:var(--muted)}
.track{height:5px; background:var(--surface-2); border-radius:3px; overflow:hidden; margin-bottom:18px}
.track div{height:100%; background:var(--accent); transition:width .25s}
.opts{display:grid; gap:8px; margin-top:14px}
.opt{text-align:left; border:1px solid var(--line); background:var(--surface); border-radius:9px; padding:11px 14px; display:flex; gap:12px; align-items:flex-start}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt .ol{font-family:var(--mono); color:var(--muted); font-size:.85rem; padding-top:1px}
.opt.right{border-color:var(--good); background:var(--good-bg)}
.opt.wrongpick{border-color:var(--bad); background:var(--bad-bg)}
.opt[disabled]{cursor:default}
.qtype{font-size:.78rem; font-weight:600; color:var(--accent)}
.whylist{margin:6px 0 0; padding-left:18px}
.whylist li{margin:4px 0}
.score{font-family:var(--mono); font-size:2.6rem; font-weight:600; letter-spacing:-.02em}

/* flashcards */
.fc{min-height:240px; border:1px solid var(--line); background:var(--surface); border-radius:16px; padding:32px 28px; display:flex; flex-direction:column; justify-content:center; text-align:center; cursor:pointer; width:100%; font-size:1.15rem}
.fc .side-lab{font-size:.78rem; color:var(--muted); margin-bottom:12px}
.fc.back{background:var(--accent-soft); border-color:color-mix(in srgb,var(--accent) 40%, var(--line))}
.boxes{display:flex; gap:6px; margin-top:6px}
.boxes div{flex:1; text-align:center; background:var(--surface-2); border-radius:6px; padding:6px 0; font-size:.78rem; color:var(--muted)}
.boxes b{display:block; font-family:var(--mono); font-size:1rem; color:var(--ink)}

/* rapid */
.rf{border-bottom:1px solid var(--line); padding:12px 2px}
.rf:last-child{border-bottom:0}
.rfq{display:flex; justify-content:space-between; gap:12px; align-items:flex-start}
.rfa{margin-top:8px; padding:10px 14px; background:var(--surface-2); border-radius:8px}

/* mock */
.bubble{background:var(--surface-2); border-radius:12px 12px 12px 4px; padding:14px 16px; margin:10px 0}
.bubble .who{font-size:.78rem; font-weight:600; color:var(--muted); margin-bottom:4px}
textarea{width:100%; min-height:150px; font:inherit; font-size:.95rem; padding:12px 14px; border:1px solid var(--line); border-radius:10px; background:var(--surface); color:var(--ink); resize:vertical}
textarea:focus{outline:2px solid var(--accent); border-color:transparent}
.checks label{display:flex; gap:10px; align-items:flex-start; padding:6px 0; cursor:pointer}
.checks input{margin-top:5px; accent-color:var(--accent)}
.gradebox{display:grid; grid-template-columns:auto 1fr; gap:14px 18px; align-items:start}
.gradebox .score{font-size:2rem}
ul.tight{margin:4px 0; padding-left:18px}
ul.tight li{margin:3px 0}

ol.plan{margin:0; padding-left:0; list-style:none; counter-reset:p}
ol.plan li{counter-increment:p; display:grid; grid-template-columns:2.2em 1fr; gap:4px 10px; padding:9px 0; border-bottom:1px solid var(--line)}
ol.plan li:last-child{border-bottom:0}
ol.plan li::before{content:counter(p); font-family:var(--mono); font-weight:600; color:var(--accent)}

.pathcols{display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:16px}
.pathcols ol{margin:0; padding-left:1.6em}
.pathcols li{padding:3px 0}

.empty{text-align:center; padding:28px 16px; color:var(--muted)}
.toast{position:fixed; left:50%; bottom:calc(24px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); background:var(--ink); color:var(--surface); padding:9px 16px; border-radius:8px; font-size:.9rem; z-index:60; opacity:0; transition:opacity .2s; pointer-events:none}
.toast.show{opacity:1}
.scrim{display:none}

@media (max-width: 900px){
  .app{grid-template-columns:1fr}
  .side{position:fixed; z-index:50; top:0; bottom:0; left:0; width:min(300px,86vw); height:100%; transform:translateX(-105%); transition:transform .2s; padding-top:calc(20px + env(safe-area-inset-top,0px)); padding-bottom:calc(28px + env(safe-area-inset-bottom,0px))}
  .side.open{transform:none; box-shadow:0 0 40px rgba(0,0,0,.25)}
  .scrim.open{display:block; position:fixed; inset:0; background:rgba(8,12,20,.4); z-index:40}
  .menu-btn{display:inline-flex}
  .top{padding:10px 14px; padding-top:calc(10px + env(safe-area-inset-top,0px))}
  .content{padding:20px 16px 64px}
  .sync{display:none}
  .search kbd{display:none}
  h1{font-size:1.45rem}
  .readout{padding:18px 16px; font-size:12.5px}
  .readout .rl{grid-template-columns:minmax(118px,auto) auto 4.5ch; gap:10px}
}
@media (prefers-reduced-motion: reduce){ *{transition:none !important; animation:none !important} }
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side" aria-label="Sections">
    <a class="brand" href="#/dashboard"><b>py/dsa prep</b><span>interview edition</span></a>
    <nav class="nav" id="nav"></nav>
    <div class="sidefoot" id="sidefoot">Batch 1: interview essentials. More modules are on the learning path.</div>
  </aside>
  <div class="scrim" id="scrim"></div>
  <div class="main">
    <header class="top">
      <button class="menu-btn" id="menuBtn" aria-label="Open menu">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
      <div class="search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Search questions, patterns, methods…" autocomplete="off" aria-label="Search">
        <kbd>/</kbd>
        <div class="results" id="results" role="listbox"></div>
      </div>
      <span class="sync" id="sync">Saved in this browser</span>
    </header>
    <main class="content" id="view"></main>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
// ===== PYTHON MOST-ASKED INTERVIEW QUESTIONS =====
const PY = [
{id:`py-list-tuple`, topic:`Data types`, tag:`Mutability`, diff:1, freq:5,
 q:`What is the difference between a list and a tuple?`,
 tests:`Whether you understand mutability and its consequences (hashability, intent), not just the bracket syntax.`,
 hint:`Think about what you can change after creation, what can be used as a dict key, and what each one communicates to a reader.`,
 answer:`Lists are mutable; tuples are immutable. Because a tuple can't change, a tuple whose items are all hashable is itself hashable, so it can be a dict key or a set member. A list never can. By convention a tuple is a fixed-shape record (a coordinate, a row, multiple return values), while a list is a growable collection of similar items. Tuples are also slightly smaller and faster to create, but that is rarely the reason to pick one.`,
 explain:`Immutability applies to the tuple's slots: you can't rebind <code>t[0]</code>. If a slot holds a mutable object such as a list, that object can still change, and the tuple stops being hashable.`,
 code:`point = (3, 4)
d = {point: "A"}        # OK: a tuple of ints is hashable
# d[[3, 4]] = "B"       # TypeError: unhashable type: 'list'

t = ([1, 2], 3)
t[0].append(99)         # allowed: the list inside changes
print(t)                # ([1, 2, 99], 3)
# hash(t)               # TypeError: unhashable type: 'list'

import sys
print(sys.getsizeof([1, 2, 3]) > sys.getsizeof((1, 2, 3)))  # True in CPython`,
 wrong:`"A tuple is just a faster list" or "tuples are always hashable." Both miss the point; a tuple containing a list is not hashable.`,
 follow:`Can the contents of a tuple ever change? When would you return a tuple from a function instead of a list?`,
 related:[`Hashing`,`Immutability`,`Dict keys`],
 points:[`Lists are mutable, tuples immutable`,`Tuples of hashable items are hashable, so they work as dict keys / set members`,`A tuple can contain mutable objects, which can still change`,`Intent: tuple = fixed record, list = growable collection`,`Minor memory/speed advantage for tuples`]},

{id:`py-is-eq`, topic:`Operators`, tag:`Identity vs equality`, diff:1, freq:5,
 q:`What is the difference between <code>is</code> and <code>==</code>?`,
 tests:`Object identity vs value equality, and whether you know the correct <code>None</code> idiom.`,
 hint:`One asks "same value?", the other asks "same object in memory?"`,
 answer:`<code>==</code> compares values by calling <code>__eq__</code>. <code>is</code> compares identity: whether both names refer to the very same object (the same <code>id()</code>). Use <code>is</code> for singletons such as <code>None</code>, and <code>==</code> for everything else.`,
 explain:`CPython caches small integers (−5 to 256) and interns some strings, so <code>is</code> can appear to work on them. That is an implementation detail; never rely on it. <code>x is None</code> is preferred over <code>x == None</code> because a class can override <code>__eq__</code>, while identity can't be faked.`,
 code:`a = [1, 2, 3]
b = [1, 2, 3]
c = a
print(a == b)   # True  - same value
print(a is b)   # False - two different list objects
print(a is c)   # True  - two names, one object

x = None
if x is None:   # the correct idiom
    print("no value")`,

{id:`py-mutable-default`, topic:`Functions`, tag:`Mutability`, diff:2, freq:5,

print(add_item(2))  # [1, 2]   <- surprise: same list
print(add_item.__defaults__)  # ([1, 2],)

    bucket.append(item)
    return bucket`,

{id:`py-copy`, topic:`Lists`, tag:`Copying`, diff:2, freq:5,

grid = [[1, 2], [3, 4]]
alias = grid                 # no copy at all
shallow = grid.copy()        # new outer list, same inner lists
deep = copy.deepcopy(grid)   # everything copied

grid[0].append(99)
print(shallow)  # [[1, 2, 99], [3, 4]]  inner lists are shared
print(deep)     # [[1, 2], [3, 4]]      fully independent`,

{id:`py-dict-o1`, topic:`Dictionaries`, tag:`Hashing`, diff:2, freq:5,
 q:`Why is dictionary lookup generally O(1)? How does a dict work internally?`,
 tests:`Hash tables, collisions, and the difference between average and worst case.`,
 hint:`What does Python compute from the key before looking anything up?`,
 answer:`A dict is a hash table. Python computes <code>hash(key)</code>, maps it to a slot in an internal table, and checks that slot. If the slot holds a different key (a collision), it probes other slots until it finds the key or an empty slot. A match requires an equal hash and then <code>==</code>. On average this touches a constant number of slots, so lookup, insert and delete are O(1) average. With many collisions it degrades to O(n). The table resizes as it fills, so insertion is amortized O(1).`,
 explain:`Insertion order is preserved; that's a language guarantee since Python 3.7. In CPython (3.6+), a dict stores a compact array of entries in insertion order plus a sparse index table of slots pointing into it, which saves memory. CPython resolves collisions with open addressing (probing), not chaining. String hashes are randomised per process, so don't depend on hash values between runs.`,
 code:`d = {}
d["apple"] = 3
# Roughly what happens:
# 1. h = hash("apple")
# 2. slot = h & (table_size - 1)
# 3. empty slot -> store; same key -> update; other key -> probe further

print("apple" in d)      # O(1) average
print(list(d))           # insertion order preserved (3.7+)`,
 wrong:`"Dict lookup is always O(1)" (it's average case) or "dicts are unordered" (outdated since 3.7).`,
 follow:`What makes an object usable as a key? What breaks if two equal objects return different hashes?`,
 related:[`Hash tables`,`Collisions`,`__hash__ / __eq__`,`Sets`],
 points:[`Dict is a hash table`,`hash(key) mapped to a slot`,`Collisions resolved by probing (open addressing in CPython)`,`Match requires equal hash then ==`,`O(1) average, O(n) worst`,`Resizing makes insertion amortized O(1)`,`Insertion order guaranteed since 3.7`]},

{id:`py-hashable`, topic:`Data types`, tag:`Hashing`, diff:2, freq:4,
 q:`Why are tuples hashable but lists are not?`,
 tests:`The contract between hashing and mutability.`,
 hint:`What would happen to a dict if a key's hash changed after it was inserted?`,
 answer:`A key's hash decides which slot it lives in. If the key could change after insertion, its hash would change and the dict would look in the wrong slot, so the entry would effectively be lost. Lists are mutable, so <code>list.__hash__</code> is set to <code>None</code>. A tuple can't change its slots, so its hash is computed from its items, but only if every item is itself hashable.`,
 explain:`User-defined classes are hashable by default (hash based on identity). If you define <code>__eq__</code> without <code>__hash__</code>, Python sets <code>__hash__</code> to <code>None</code> so equal objects can't end up with different hashes.`,
 code:`print(hash((1, 2)))        # works
s = {(1, 2), (3, 4)}       # tuples as set members
print(list.__hash__)       # None
# hash([1, 2])             # TypeError: unhashable type: 'list'
# hash((1, [2]))           # TypeError: a tuple containing a list`,
 wrong:`"All immutable-looking containers are hashable." A tuple containing a list is not.`,
 follow:`Are instances of your own classes hashable? What happens if you override <code>__eq__</code> only?`,
 related:[`Dict internals`,`frozenset`,`__hash__`],
 points:[`Hash determines the slot`,`Hash must not change while the object is a key`,`Lists are mutable so __hash__ is None`,`Tuple hash computed from items; all items must be hashable`]},

{id:`py-generators`, topic:`Iterators & Generators`, tag:`Generators`, diff:2, freq:5,
 q:`What does <code>yield</code> do? How do generators work?`,
 tests:`Lazy evaluation, suspended execution state, and memory trade-offs.`,
 hint:`What happens to the function's local variables between two calls to <code>next()</code>?`,
 answer:`A function containing <code>yield</code> is a generator function. Calling it doesn't run the body; it returns a generator object. Each <code>next()</code> runs the body until the next <code>yield</code>, hands that value out, and suspends, keeping the local variables and position. The next <code>next()</code> resumes right after the <code>yield</code>. When the body finishes, <code>StopIteration</code> is raised. Values are produced lazily, one at a time, so memory stays O(1) however long the sequence is.`,
 explain:`Generators are iterators: single-pass, and exhausted once consumed. Generator expressions <code>(x for x in ...)</code> are the inline form. <code>yield from</code> delegates to another iterable.`,
 code:`def count_up(n):
    i = 0
    while i < n:
        yield i      # pause here, hand i to the caller
        i += 1

g = count_up(3)
print(next(g), next(g), next(g))  # 0 1 2
# next(g) now raises StopIteration

big = (x * x for x in range(10**9))   # no billion-item list is built
print(next(big))  # 0`,
 wrong:`"<code>yield</code> works like <code>return</code>." Return ends the function; yield pauses it.`,
 follow:`Can you iterate a generator twice? What do <code>yield from</code> and <code>send()</code> do?`,
 related:[`Iterators`,`Lazy evaluation`,`itertools`],
 points:[`Calling a generator function returns a generator, body doesn't run`,`next() runs to the next yield and suspends`,`Local state preserved between calls`,`StopIteration at the end`,`Lazy, O(1) memory`,`Single-pass / exhaustible`]},

{id:`py-decorators`, topic:`Decorators`, tag:`Decorators`, diff:3, freq:5,
 q:`What is a decorator? Write one that times a function.`,
 tests:`First-class functions, closures, <code>*args/**kwargs</code> forwarding, and <code>functools.wraps</code>.`,
 hint:`<code>@timer</code> above <code>def f</code> is exactly <code>f = timer(f)</code>.`,
 answer:`A decorator is a callable that takes a function and returns a replacement, usually a wrapper that adds behaviour before and after calling the original. <code>@dec</code> is syntactic sugar for <code>f = dec(f)</code>, applied once at definition time. It works because functions are first-class objects and the wrapper is a closure over the original function. Use <code>functools.wraps</code> so the wrapper keeps the original name and docstring.`,
 explain:`Stacked decorators apply bottom-up: the one closest to <code>def</code> wraps first, so the top one runs first at call time. A decorator that takes arguments, such as <code>@retry(times=3)</code>, needs one more level: a function that returns the decorator.`,
 code:`import functools, time

def timer(func):
    @functools.wraps(func)            # keep __name__, __doc__
    def wrapper(*args, **kwargs):
        start = time.perf_counter()
        result = func(*args, **kwargs)
        elapsed = time.perf_counter() - start
        print(f"{func.__name__} took {elapsed:.4f}s")
        return result                 # don't lose the return value!
    return wrapper

@timer                 # same as: slow_sum = timer(slow_sum)
def slow_sum(n):
    return sum(range(n))

slow_sum(1_000_000)`,
 wrong:`Forgetting to return <code>result</code> (the decorated function now returns <code>None</code>), or forgetting <code>wraps</code>.`,
 follow:`Write <code>@retry(times=3)</code>. In what order do stacked decorators run?`,
 related:[`Closures`,`First-class functions`,`functools`],
 points:[`Takes a function, returns a replacement`,`@dec is f = dec(f) at definition time`,`Wrapper is a closure`,`Forward *args/**kwargs and return the result`,`functools.wraps preserves metadata`]},

{id:`py-args-kwargs`, topic:`Functions`, tag:`Functions`, diff:1, freq:4,

def area(*, width, height):  # keyword-only

{id:`py-legb`, topic:`Scope & Closures`, tag:`Scope & closures`, diff:2, freq:5,
 q:`Explain LEGB scope and closures.`,
 tests:`Name resolution, why <code>UnboundLocalError</code> happens, and what a closure captures.`,
 hint:`Where does Python look for a name, and in what order? What does assignment inside a function do to a name?`,
 answer:`Python resolves names in the order Local → Enclosing → Global → Built-in. Any assignment to a name inside a function makes that name local for the whole function (decided at compile time), which is why reading it before the assignment raises <code>UnboundLocalError</code>. <code>global</code> and <code>nonlocal</code> override that. A closure is an inner function that remembers variables from its enclosing function's scope even after the outer function has returned. The captured variables live in cells (<code>func.__closure__</code>).`,
 explain:`Closures capture variables, not values, so they see the variable's value at call time. That's the cause of the famous "lambdas in a loop all return the last value" trap.`,
 code:`x = "global"
def outer():
    x = "enclosing"
    def inner():
        return x            # found in the Enclosing scope
    return inner
print(outer()())            # enclosing

def counter():
    count = 0
    def inc():
        nonlocal count      # without this: UnboundLocalError
        count += 1
        return count
    return inc

c = counter()
c()
print(c())                  # 2  (state survives between calls)`,
 wrong:`"Closures copy the variable's value when they're created." They capture the variable and look it up later.`,
 follow:`Why does <code>[lambda: i for i in range(3)]</code> produce functions that all return 2?`,
 related:[`nonlocal`,`Decorators`,`Late binding`],
 points:[`Lookup order Local, Enclosing, Global, Built-in`,`Assignment makes a name local for the whole function`,`global / nonlocal to rebind outer names`,`Closure remembers enclosing variables after outer returns`,`Captures variables (late binding), not values`]},

{id:`py-gil`, topic:`Advanced Python`, tag:`Concurrency`, diff:3, freq:5,
 q:`What is the GIL? When would you use threads, processes, or asyncio?`,
 tests:`CPU-bound vs I/O-bound work, and knowing what's a CPython implementation detail.`,
 hint:`Can two threads run Python bytecode at the same instant in standard CPython? What about while waiting on the network?`,
 answer:`The Global Interpreter Lock is a CPython mechanism that lets only one thread execute Python bytecode at a time within one interpreter. Threads still help I/O-bound work, because the GIL is released while waiting on I/O. They don't speed up CPU-bound pure-Python code. For CPU-bound work, use multiprocessing (separate processes, each with its own interpreter and GIL) or libraries like NumPy whose C code releases the GIL. asyncio runs many I/O tasks concurrently on a single thread using cooperative <code>await</code> points, which suits large numbers of network connections.`,
 explain:`The GIL is a CPython detail, not part of the Python language. CPython 3.13 introduced an optional, experimental free-threaded build (PEP 703) that can run without the GIL; standard builds still have it. The GIL doesn't make your code thread-safe: <code>x += 1</code> is several bytecode steps and can still race.`,
 code:`from concurrent.futures import ThreadPoolExecutor, ProcessPoolExecutor

def cpu_task(n):                       # pure computation -> processes
    return sum(i * i for i in range(n))

def io_task(path):                     # waiting on disk/network -> threads
    with open(path) as f:
        return len(f.read())

if __name__ == "__main__":            # required for processes on spawn platforms
    with ProcessPoolExecutor() as pool:
        print(list(pool.map(cpu_task, [10**6] * 4)))`,
 wrong:`"Python can't do concurrency" or "the GIL makes Python code thread-safe." Both are wrong.`,
 follow:`Is the GIL part of the Python language? Is <code>count += 1</code> atomic across threads?`,
 related:[`threading`,`multiprocessing`,`asyncio`],
 points:[`GIL: one thread runs Python bytecode at a time (CPython)`,`Threads help I/O-bound work, GIL released during I/O`,`CPU-bound: multiprocessing or C extensions`,`asyncio: single-thread cooperative concurrency for many I/O tasks`,`CPython detail, free-threaded build experimental in 3.13`,`GIL does not make code thread-safe`]},

{id:`py-mro`, topic:`OOP`, tag:`OOP`, diff:3, freq:4,
 q:`What is MRO, and how does <code>super()</code> use it?`,
 tests:`Multiple inheritance, the C3 linearization, and the common misconception that <code>super()</code> means "my parent".`,
 hint:`In a diamond D(B, C) where both inherit A, where does B's <code>super()</code> go?`,
 answer:`The Method Resolution Order is the sequence of classes Python searches for an attribute, available as <code>Cls.__mro__</code>. It's computed with C3 linearization: a class comes before its parents, parents keep the order they're listed in, and every class appears exactly once. <code>super()</code> doesn't mean "my parent class". It means "the next class after me in the MRO of the object's actual type". That's why cooperative methods in a diamond each run exactly once.`,
 explain:`If no consistent order exists (for example <code>X(A, B)</code> and <code>Y(B, A)</code>, then <code>class Z(X, Y)</code>), Python raises <code>TypeError</code> at class creation.`,
 code:`class A:
    def hi(self): print("A")
class B(A):
    def hi(self):
        print("B"); super().hi()
class C(A):
    def hi(self):
        print("C"); super().hi()
class D(B, C):
    def hi(self):
        print("D"); super().hi()

D().hi()   # D B C A   (B's super() goes to C, not A!)
print([k.__name__ for k in D.__mro__])
# ['D', 'B', 'C', 'A', 'object']`,
 wrong:`"<code>super()</code> always calls the parent class." It calls the next class in the MRO.`,
 follow:`When does C3 linearization fail? Why should cooperative methods accept <code>**kwargs</code>?`,
 related:[`Inheritance`,`Diamond problem`,`super()`],
 points:[`MRO = attribute search order (__mro__)`,`C3 linearization: child before parents, declared order kept, each class once`,`super() = next class in the MRO of the instance's type`,`Diamond: each method runs once`,`Inconsistent MRO raises TypeError`]},

{id:`py-classmethod`, topic:`OOP`, tag:`OOP`, diff:2, freq:4,
 q:`What is the difference between <code>@classmethod</code> and <code>@staticmethod</code>?`,
 tests:`What each receives as its first argument, and the typical use case for each.`,
 hint:`One receives the class, the other receives nothing extra.`,
 answer:`An instance method receives the instance (<code>self</code>). A class method receives the class (<code>cls</code>), so it can create instances or read class-level state. It's the standard way to write alternative constructors, and because it uses <code>cls</code> it works correctly for subclasses. A static method receives nothing automatically. It's a plain function placed in the class's namespace because it logically belongs there.`,
 explain:`Classic example: <code>dict.fromkeys</code> and <code>datetime.fromtimestamp</code> are class methods acting as alternative constructors.`,
 code:`class Date:
    def __init__(self, y, m, d):
        self.y, self.m, self.d = y, m, d

    @classmethod
    def from_string(cls, s):          # alternative constructor
        y, m, d = map(int, s.split("-"))
        return cls(y, m, d)           # cls -> subclasses get subclasses

    @staticmethod
    def is_valid(s):                  # helper, needs no cls or self
        return len(s.split("-")) == 3

d = Date.from_string("2026-10-05")
print(Date.is_valid("2026-10-05"))   # True`,
 wrong:`"Static methods are for class variables." That's what class methods are for.`,
 follow:`Why use <code>cls(...)</code> instead of <code>Date(...)</code> inside the class method?`,
 related:[`Alternative constructors`,`Inheritance`],
 points:[`classmethod receives cls`,`Used for alternative constructors / class state`,`Works with subclasses via cls`,`staticmethod receives nothing implicit`,`staticmethod = namespaced helper function`]},

{id:`py-context`, topic:`Context Managers`, tag:`Context managers`, diff:2, freq:4,
 q:`What is a context manager? How does <code>with</code> work?`,
 tests:`Guaranteed cleanup, the protocol methods, and <code>contextlib</code>.`,
 hint:`Which two dunder methods does <code>with</code> call, and when?`,
 answer:`A context manager is an object that defines setup and teardown around a block of code. <code>with</code> calls <code>__enter__</code> (its return value is bound by <code>as</code>), runs the block, then always calls <code>__exit__(exc_type, exc, tb)</code>, even if the block raised an exception. If <code>__exit__</code> returns True, the exception is suppressed. Typical uses are files, locks, database transactions and temporary state. <code>contextlib.contextmanager</code> lets you write one as a generator: code before <code>yield</code> is setup, code after is teardown.`,
 explain:`Behind the scenes <code>with</code> is equivalent to a <code>try/finally</code>, but reusable and harder to get wrong.`,
 code:`with open("data.txt", "w") as f:   # __enter__ returns the file
    f.write("hi")
# __exit__ has run: file closed, even on error

from contextlib import contextmanager
import time

@contextmanager
def timed(label):
    start = time.perf_counter()
    try:
        yield                       # the with-block runs here
    finally:
        print(label, time.perf_counter() - start)

with timed("work"):
    sum(range(10**6))`,
 wrong:`"<code>with</code> is only for files."`,
 follow:`How would you ignore one specific exception? (<code>contextlib.suppress</code>)`,
 related:[`try/finally`,`contextlib`,`Generators`],
 points:[`Setup/teardown around a block`,`__enter__ then block then __exit__ always`,`__exit__ returning True suppresses the exception`,`Uses: files, locks, transactions`,`contextlib.contextmanager generator form`]},

{id:`py-iter`, topic:`Iterators & Generators`, tag:`Iterators`, diff:2, freq:4,
 q:`What is the difference between an iterable and an iterator?`,
 tests:`The iteration protocol and what a <code>for</code> loop really does.`,
 hint:`A list can be looped over many times. Can <code>iter(list)</code>?`,
 answer:`An iterable is anything you can get an iterator from: it implements <code>__iter__</code> (lists, strings, dicts, files). An iterator is the object that produces values one at a time with <code>__next__</code>, raising <code>StopIteration</code> when done. Its <code>__iter__</code> returns itself. Iterables can usually be looped over many times; an iterator is single-pass and exhausted once consumed. A <code>for</code> loop calls <code>iter()</code> once, then <code>next()</code> repeatedly until <code>StopIteration</code>.`,
 explain:`Every generator is an iterator. <code>zip</code>, <code>map</code>, <code>filter</code> and <code>enumerate</code> return iterators, which is why they appear "empty" the second time you use them.`,
 code:`nums = [1, 2, 3]          # iterable
it = iter(nums)           # iterator
print(next(it), next(it)) # 1 2
print(list(it))           # [3]
print(list(it))           # []  <- exhausted

# What a for loop does:
it = iter(nums)
while True:
    try:
        x = next(it)
    except StopIteration:
        break
    print(x)`,
 wrong:`"They're the same thing." A list is iterable but not an iterator: <code>next([1, 2])</code> raises <code>TypeError</code>.`,
 follow:`Why does <code>z = zip(a, b); list(z); list(z)</code> return an empty list the second time?`,
 related:[`Generators`,`for loops`,`itertools`],
 points:[`Iterable implements __iter__`,`Iterator implements __next__ (and __iter__ returning self)`,`StopIteration ends iteration`,`Iterators are single-pass`,`for calls iter() then next() repeatedly`]},

{id:`py-pass-by`, topic:`Functions`, tag:`Mutability`, diff:2, freq:5,
 q:`Is Python pass-by-value or pass-by-reference?`,
 tests:`Whether you can explain mutation vs rebinding precisely.`,
 hint:`Inside a function, compare <code>lst.append(4)</code> with <code>lst = [99]</code>.`,
 answer:`Neither, in the C++ sense. Python passes references to objects, often called "pass by object reference" or "call by sharing". The parameter name is bound to the same object the caller passed. If the function mutates that object (for example <code>append</code>), the caller sees the change. If the function rebinds the parameter name (<code>lst = [99]</code>), only the local name changes and the caller is unaffected. Immutable objects like ints and strings can't be mutated, so they behave as if passed by value.`,
 explain:`Assignment in Python never copies data; it binds a name to an object. Function parameters are just assignment.`,
 code:`def modify(lst):
    lst.append(4)      # mutates the shared object -> caller sees it

def rebind(lst):
    lst = [99]         # rebinds the local name -> caller doesn't

a = [1, 2, 3]
modify(a)
rebind(a)
print(a)   # [1, 2, 3, 4]`,
 wrong:`"Lists are passed by reference and ints by value." Every argument is passed the same way; ints just can't be mutated.`,
 follow:`How would you make a function that doesn't modify the caller's list?`,
 related:[`References`,`Mutability`,`Copying`],
 points:[`Pass by object reference / call by sharing`,`Parameter bound to the same object`,`Mutation visible to caller`,`Rebinding not visible`,`Immutables can't be mutated`]},

{id:`py-str-repr`, topic:`OOP`, tag:`OOP`, diff:1, freq:3,
 q:`What is the difference between <code>__str__</code> and <code>__repr__</code>?`,
 tests:`Dunder methods and audience: users vs developers.`,
 hint:`Which one do you see when an object is inside a list?`,
 answer:`<code>__repr__</code> gives an unambiguous representation for developers, ideally one that looks like valid code to recreate the object. It's used by the REPL, debuggers and containers. <code>__str__</code> gives a readable representation for end users and is used by <code>print()</code> and <code>str()</code>. If <code>__str__</code> isn't defined, Python falls back to <code>__repr__</code>, so if you implement only one, implement <code>__repr__</code>.`,
 explain:`f-strings call <code>__str__</code> by default; <code>f"{x!r}"</code> forces <code>__repr__</code>.`,
 code:`class Point:
    def __init__(self, x, y):
        self.x, self.y = x, y
    def __repr__(self):
        return f"Point(x={self.x}, y={self.y})"
    def __str__(self):
        return f"({self.x}, {self.y})"

p = Point(1, 2)
print(p)      # (1, 2)                <- __str__
print([p])    # [Point(x=1, y=2)]     <- containers use __repr__
print(f"{p!r}")  # Point(x=1, y=2)`,
 wrong:`"They're interchangeable."`,
 follow:`Which one does a dataclass generate for you?`,
 related:[`Dunder methods`,`dataclasses`],
 points:[`__repr__ unambiguous, for developers`,`__str__ readable, for users`,`print/str use __str__, containers/REPL use __repr__`,`__str__ falls back to __repr__`]},

{id:`py-comp-gen`, topic:`Lists`, tag:`Generators`, diff:2, freq:4,
 q:`List comprehension vs generator expression: what's the difference?`,
 tests:`Eager vs lazy evaluation and memory awareness.`,
 hint:`Square brackets vs parentheses. What gets built in memory?`,
 answer:`A list comprehension <code>[...]</code> builds the entire list in memory immediately, which you can index and iterate many times. A generator expression <code>(...)</code> produces items lazily, one at a time, using constant memory, but it can only be iterated once and can't be indexed. Use a generator expression when you consume the values once, especially when passing them to <code>sum</code>, <code>any</code>, <code>max</code> or <code>"".join</code>.`,
 explain:`When a generator expression is the only argument to a function, you can drop the extra parentheses: <code>sum(x * x for x in nums)</code>.`,
 code:`import sys
lst = [x * x for x in range(1_000_000)]
gen = (x * x for x in range(1_000_000))
print(sys.getsizeof(lst))   # about 8 MB (CPython, 64-bit)
print(sys.getsizeof(gen))   # a couple of hundred bytes

print(sum(x * x for x in range(10)))   # 285
print(any(n > 5 for n in [1, 9, 3]))   # True, stops at 9`,
 wrong:`"Generator expressions are always faster." They save memory; for small data a list can be as fast or faster.`,
 follow:`Why can <code>any(...)</code> with a generator stop early?`,
 related:[`Generators`,`Lazy evaluation`,`Comprehensions`],
 points:[`List comprehension eager, builds full list`,`Generator expression lazy, O(1) memory`,`Generator single-pass, not indexable`,`Prefer generators for one-pass aggregation`]},

{id:`py-call`, topic:`Python Internals`, tag:`Internals`, diff:3, freq:3,
 q:`What happens when a Python function is called?`,
 tests:`The execution model: frames, the call stack, and bytecode.`,
 hint:`Think about what object stores a call's local variables, and where it goes.`,
 answer:`The arguments are evaluated left to right. Python creates a new frame object holding that call's local variables, with the parameters bound to the argument objects. The frame is pushed onto the call stack and the function's bytecode runs in the interpreter loop. On <code>return</code> (or the end of the body, which returns <code>None</code>), the value is handed back to the caller and the frame is popped. Its locals are freed once nothing references them, unless a closure captured them. Each call gets its own frame, which is what makes recursion work, and CPython limits stack depth (<code>sys.getrecursionlimit()</code>, default 1000).`,
 explain:`CPython first compiles source code to bytecode (cached in <code>.pyc</code> files), and the interpreter executes that bytecode. The <code>dis</code> module shows it. Exact opcode names change between CPython versions, so treat them as an implementation detail.`,
 code:`import dis

def add(a, b):
    return a + b

dis.dis(add)
# Roughly: LOAD_FAST a, LOAD_FAST b, BINARY_OP (+), RETURN_VALUE
# (opcode names vary between CPython versions)

import sys
print(sys.getrecursionlimit())   # 1000 by default`,
 wrong:`"Python interprets the source line by line." CPython compiles to bytecode first.`,
 follow:`Why does deep recursion raise <code>RecursionError</code>? Does Python do tail-call optimisation? (No.)`,
 related:[`Call stack`,`Recursion`,`Bytecode`],
 points:[`Arguments evaluated left to right`,`New frame with its own locals`,`Frame pushed on the call stack`,`Bytecode executed`,`Return value passed back, frame popped`,`Recursion limit, no tail-call optimisation`]},

{id:`py-exceptions`, topic:`Exception Handling`, tag:`Exceptions`, diff:1, freq:4,
 q:`Explain <code>try</code>, <code>except</code>, <code>else</code> and <code>finally</code>.`,
 tests:`Control flow through exception handlers, and good practice.`,
 hint:`Which block runs only when nothing went wrong? Which runs no matter what?`,
 answer:`<code>try</code> holds code that might raise. <code>except</code> clauses are checked in order, and the first matching one handles the exception, so put specific exceptions before general ones. <code>else</code> runs only if the <code>try</code> block raised nothing; it's the place for code that should run on success but whose own errors you don't want to catch. <code>finally</code> always runs, whether there was an exception, a <code>return</code>, or a <code>break</code>, and it's used for cleanup.`,
 explain:`Good practice: catch the narrowest exception you can, never use a bare <code>except:</code> (it also catches <code>KeyboardInterrupt</code> and <code>SystemExit</code>), and use <code>raise ... from err</code> to chain exceptions.`,
 code:`def parse(s):
    try:
        n = int(s)
    except ValueError as e:
        print("bad input:", e)
        return None
    else:
        print("parsed OK")   # only if no exception
        return n
    finally:
        print("cleanup")     # always, even after return

parse("42")   # parsed OK, cleanup
parse("x")    # bad input: ..., cleanup`,
 wrong:`"<code>else</code> runs when an exception happens."`,
 follow:`Why is a bare <code>except:</code> dangerous? How do you define a custom exception?`,
 related:[`Exception hierarchy`,`Context managers`],
 points:[`try holds risky code`,`except checked in order, first match wins`,`else runs only on success`,`finally always runs`,`Catch specific exceptions, avoid bare except`]}
];

{id:`dsa-two-sum`, title:`Two Sum`, pattern:`hashing`, diff:1, freq:5,
 prompt:`Given an array <code>nums</code> and an integer <code>target</code>, return the indices of the two numbers that add up to <code>target</code>. Exactly one solution exists, and you may not use the same element twice.`,
 recognize:`"Find a pair that sums to X" in an <em>unsorted</em> array: remember what you've seen in a hash map. If the array were sorted, two pointers would work with O(1) space.`,
 testing:`Trading space for time, and handling the "same element twice" edge case.`,
 brute:`Check every pair with two nested loops: O(n²) time, O(1) space.`,
 code:`def two_sum(nums, target):
    seen = {}                       # value -> index
    for i, x in enumerate(nums):
        need = target - x
        if need in seen:
            return [seen[need], i]
        seen[x] = i                 # store AFTER checking
    return []`,
 time:`O(n)`, space:`O(n)`,
 dry:`nums = [2, 7, 11, 15], target = 9
i=0, x=2: need 7, not seen, seen = {2: 0}
i=1, x=7: need 2, found at index 0, return [0, 1]`,

{id:`dsa-parens`, title:`Valid Parentheses`, pattern:`stack`, diff:1, freq:5,

 brute:`Repeatedly delete "()", "[]" and "{}" until nothing changes: O(n²).`,
 code:`def is_valid(s):
    pairs = {")": "(", "]": "[", "}": "{"}
    stack = []
    for ch in s:
        if ch in pairs:                       # a closing bracket
            if not stack or stack[-1] != pairs[ch]:
                return False
            stack.pop()
        else:                                 # an opening bracket
            stack.append(ch)
    return not stack          # leftovers mean unclosed brackets`,

"(" push, stack = ["("]
"[" push, stack = ["(", "["]
")" top is "[" but need "(", return False`,

{id:`dsa-stock`, title:`Best Time to Buy and Sell Stock`, pattern:`greedy`, diff:1, freq:5,

 code:`def max_profit(prices):
    best, lowest = 0, float("inf")
    for p in prices:
        lowest = min(lowest, p)        # cheapest buy so far
        best = max(best, p - lowest)   # what if we sell today?
    return best`,

lowest: 7 -> 1 (day 1)
profits if selling: 5-1=4, 3-1=2, 6-1=5 (best), 4-1=3
answer: 5`,

{id:`dsa-longest-substring`, title:`Longest Substring Without Repeating Characters`, pattern:`sliding-window`, diff:2, freq:5,

 testing:`Window invariants, and moving the left pointer correctly.`,
 brute:`Check every substring for uniqueness: O(n³), or O(n²) with a set.`,
 code:`def length_of_longest_substring(s):
    last = {}                    # char -> last index seen
    left = best = 0
    for right, ch in enumerate(s):
        if ch in last and last[ch] >= left:

        last[ch] = right
        best = max(best, right - left + 1)
    return best`,

r=0 'a': window "a", best 1
r=1 'b': window "ab", best 2
r=2 'b': duplicate at 1, left = 2, window "b"

{id:`dsa-kadane`, title:`Maximum Subarray (Kadane's algorithm)`, pattern:`dp`, diff:2, freq:5,
 prompt:`Find the contiguous subarray with the largest sum and return that sum.`,

 testing:`A tiny piece of DP thinking: the best subarray ending here depends only on the best ending one step earlier.`,
 brute:`Sum every subarray: O(n²) with running sums.`,
 code:`def max_subarray(nums):
    best = cur = nums[0]
    for x in nums[1:]:
        cur = max(x, cur + x)      # extend the run, or start at x
        best = max(best, cur)
    return best`,

cur: -2, 1, -2, 4, 3, 5, 6, 1, 5
best: 6  (subarray [4, -1, 2, 1])`,

{id:`dsa-subarray-k`, title:`Subarray Sum Equals K`, pattern:`prefix-sum`, diff:2, freq:5,
 prompt:`Count the contiguous subarrays whose sum equals <code>k</code>. The array may contain negative numbers.`,
 recognize:`"Count subarrays with sum k" plus negative numbers: sliding window breaks, so use prefix sums with a hash map.`,
 testing:`The prefix-sum identity sum(i..j) = P[j] − P[i−1], and why negatives rule out a sliding window.`,
 brute:`Try every start and extend: O(n²).`,
 code:`from collections import defaultdict

def subarray_sum(nums, k):
    count = defaultdict(int)
    count[0] = 1             # empty prefix: subarrays starting at index 0
    prefix = total = 0
    for x in nums:
        prefix += x
        total += count[prefix - k]   # earlier prefixes P with prefix - P == k
        count[prefix] += 1
    return total`,

prefix 1: need -1, none.  counts {0:1, 1:1}
prefix 2: need 0, one.    total 1
prefix 3: need 1, one.    total 2`,

{id:`dsa-reverse-ll`, title:`Reverse a Linked List`, pattern:`linked-list`, diff:1, freq:5,

 code:`class ListNode:
    def __init__(self, val=0, next=None):
        self.val, self.next = val, next

def reverse_list(head):
    prev, cur = None, head
    while cur:
        nxt = cur.next        # save it before overwriting
        cur.next = prev       # flip the pointer
        prev, cur = cur, nxt
    return prev               # the old tail is the new head`,

step 1: None <- 1   2 -> 3
step 2: None <- 1 <- 2   3
step 3: None <- 1 <- 2 <- 3   return 3`,

        fast = fast.next.next
        if slow is fast:       # same node object, not equal values
            return True
    return False`,

{id:`dsa-search-range`, title:`First and Last Position in a Sorted Array`, pattern:`binary-search`, diff:2, freq:4,
 prompt:`Given a sorted array, return the first and last index of <code>target</code>, or <code>[-1, -1]</code>, in O(log n).`,
 recognize:`Sorted input plus "first/last position" or "insertion point": a lower-bound binary search.`,
 testing:`Off-by-one discipline with a half-open interval [lo, hi).`,
 brute:`Linear scan: O(n).`,
 code:`def lower_bound(nums, target):
    lo, hi = 0, len(nums)            # search in [lo, hi)
    while lo < hi:
        mid = (lo + hi) // 2
        if nums[mid] < target:
            lo = mid + 1
        else:
            hi = mid
    return lo                        # first index with nums[i] >= target

def search_range(nums, target):
    left = lower_bound(nums, target)
    if left == len(nums) or nums[left] != target:
        return [-1, -1]
    right = lower_bound(nums, target + 1) - 1   # integers only
    return [left, right]

# Standard library: bisect.bisect_left / bisect.bisect_right`,

 dry:`nums = [5, 7, 7, 8, 8, 10], target = 8
lower_bound(8) = 3
lower_bound(9) = 5, so right = 4
answer: [3, 4]`,

{id:`dsa-merge-intervals`, title:`Merge Intervals`, pattern:`greedy`, diff:2, freq:5,

    intervals.sort(key=lambda iv: iv[0])
    merged = []
    for start, end in intervals:
        if merged and start <= merged[-1][1]:        # overlaps the last one
            merged[-1][1] = max(merged[-1][1], end)
        else:

    return merged`,

[1,3] + [2,6] overlap -> [1,6]

answer: [[1,6],[8,10],[15,18]]`,

{id:`dsa-topk`, title:`Top K Frequent Elements`, pattern:`heap`, diff:2, freq:5,
 prompt:`Return the <code>k</code> most frequent elements of <code>nums</code>.`,
 recognize:`"Top k", "k largest", "k most frequent": a heap of size k, or bucket sort when counts are bounded.`,
 testing:`Counter plus heapq fluency, and the O(n log k) vs O(n) trade-off.`,
 brute:`Count, then sort all items by count: O(n log n).`,
 code:`from collections import Counter
import heapq

def top_k_frequent(nums, k):              # O(n log k)
    freq = Counter(nums)
    return heapq.nlargest(k, freq, key=freq.get)

def top_k_bucket(nums, k):                # O(n)
    freq = Counter(nums)
    buckets = [[] for _ in range(len(nums) + 1)]
    for num, c in freq.items():
        buckets[c].append(num)            # index = frequency
    out = []
    for c in range(len(buckets) - 1, 0, -1):
        for num in buckets[c]:
            out.append(num)
            if len(out) == k:
                return out
    return out`,

freq = {1:3, 2:2, 3:1}
buckets[3] = [1], buckets[2] = [2]
answer: [1, 2]`,

{id:`dsa-islands`, title:`Number of Islands`, pattern:`bfs`, diff:2, freq:5,
 prompt:`Given a grid of "1" (land) and "0" (water), count the islands. Land connects horizontally and vertically.`,
 recognize:`Counting connected regions in a grid: start a BFS or DFS from each unvisited land cell.`,
 testing:`Grid traversal, visited marking, and bounds checks.`,
 brute:`This is already the natural approach; the "brute force" mistake is revisiting cells without marking them.`,
 code:`from collections import deque

def num_islands(grid):
    if not grid:
        return 0
    rows, cols = len(grid), len(grid[0])
    islands = 0
    for r in range(rows):
        for c in range(cols):
            if grid[r][c] != "1":
                continue
            islands += 1
            grid[r][c] = "0"                  # mark when enqueuing
            queue = deque([(r, c)])
            while queue:
                cr, cc = queue.popleft()
                for dr, dc in ((1, 0), (-1, 0), (0, 1), (0, -1)):
                    nr, nc = cr + dr, cc + dc
                    if 0 <= nr < rows and 0 <= nc < cols and grid[nr][nc] == "1":
                        grid[nr][nc] = "0"
                        queue.append((nr, nc))
    return islands`,
 time:`O(rows × cols)`, space:`O(rows × cols) worst-case queue`,
 dry:`Each land cell is enqueued exactly once and then turned to "0".
Each BFS start is one new island.`,
 mistakes:`Marking cells when dequeued instead of enqueued adds duplicates to the queue. Recursive DFS can hit Python's recursion limit on large grids. Mutating the input: ask the interviewer whether that's allowed.`,
 follow:`Max area of an island. Count distinct island shapes. Islands with diagonal connections.`},

{id:`dsa-temps`, title:`Daily Temperatures`, pattern:`monotonic-stack`, diff:2, freq:4,
 prompt:`For each day, return how many days you'd wait for a warmer temperature, or 0 if none comes.`,
 recognize:`"Next greater element" for every position: a monotonic stack.`,
 testing:`Whether you see that each index is pushed and popped once, so the total is O(n).`,
 brute:`For each day, scan forward: O(n²).`,
 code:`def daily_temperatures(temps):
    answer = [0] * len(temps)
    stack = []                      # indices still waiting; temps decreasing
    for i, t in enumerate(temps):
        while stack and temps[stack[-1]] < t:
            j = stack.pop()
            answer[j] = i - j       # day j found its warmer day
        stack.append(i)
    return answer`,
 time:`O(n)`, space:`O(n)`,
 dry:`temps = [73, 74, 75, 71, 69, 72, 76, 73]
answer = [1, 1, 4, 2, 1, 1, 0, 0]`,

{id:`dsa-level-order`, title:`Binary Tree Level Order Traversal`, pattern:`bfs`, diff:2, freq:5,
 prompt:`Return a binary tree's node values level by level, as a list of lists.`,
 recognize:`"Level by level", "minimum depth", "nodes at distance k": BFS with a queue.`,
 testing:`BFS on trees and the level-size trick.`,
 brute:`DFS while passing the depth also works, at O(n).`,
 code:`from collections import deque

def level_order(root):
    if not root:
        return []
    levels, queue = [], deque([root])
    while queue:
        level = []
        for _ in range(len(queue)):        # exactly one level per pass
            node = queue.popleft()
            level.append(node.val)
            if node.left:
                queue.append(node.left)
            if node.right:
                queue.append(node.right)
        levels.append(level)
    return levels`,
 time:`O(n)`, space:`O(width of the tree)`,
 dry:`    3
   / \\
  9  20
     / \\
    15  7
-> [[3], [9, 20], [15, 7]]`,

{id:`dsa-coin-change`, title:`Coin Change (minimum coins)`, pattern:`dp`, diff:2, freq:5,
 prompt:`Given coin values and an amount, return the fewest coins needed to make the amount, or -1 if it's impossible. Each coin can be used any number of times.`,
 recognize:`"Minimum number of …" with repeated choices and overlapping subproblems: DP. Greedy fails here.`,
 testing:`Defining a DP state and transition, and knowing why greedy is wrong.`,
 brute:`Recursively try every coin at every step: exponential time.`,
 code:`def coin_change(coins, amount):
    INF = amount + 1
    dp = [0] + [INF] * amount        # dp[a] = fewest coins to make a
    for a in range(1, amount + 1):
        for c in coins:
            if c <= a:
                dp[a] = min(dp[a], dp[a - c] + 1)
    return dp[amount] if dp[amount] != INF else -1`,
 time:`O(amount × len(coins))`, space:`O(amount)`,
 dry:`coins = [1, 3, 4], amount = 6
greedy: 4 + 1 + 1 = 3 coins (wrong)
dp: dp[3] = 1, dp[6] = dp[3] + 1 = 2  (3 + 3)`,

{id:`dsa-subsets`, title:`Subsets`, pattern:`backtracking`, diff:2, freq:4,
 prompt:`Given distinct integers, return all possible subsets (the power set).`,
 recognize:`"Return all combinations / subsets / permutations": backtracking (choose, explore, un-choose).`,
 testing:`The backtracking template and copying the path correctly.`,
 brute:`Iterate over bitmasks 0 to 2ⁿ−1, which is also a valid answer.`,
 code:`def subsets(nums):
    result, path = [], []
    def backtrack(start):
        result.append(path[:])          # copy! path keeps changing
        for i in range(start, len(nums)):
            path.append(nums[i])        # choose
            backtrack(i + 1)            # explore
            path.pop()                  # un-choose
    backtrack(0)
    return result`,

        self.size = [1] * n
    def find(self, x):

            self.parent[x] = self.parent[self.parent[x]]   # path halving
            x = self.parent[x]

    def union(self, a, b):

 points:[`Overlapping subproblems`,`Optimal substructure`,`Define state, transition, base case`,`Memoization vs tabulation`,`Signals: count ways / min / max with repeated choices`,`Complexity = states × work per state`]},

 answer:`A collision is when two keys map to the same bucket. Chaining stores a list (or tree) of entries per bucket. Open addressing probes for another slot (linear, quadratic or pseudo-random probing); CPython's dict uses open addressing. A good hash function and resizing when the load factor gets high keep chains or probe sequences short, so operations stay O(1) on average, with an O(n) worst case.`,
 points:[`Collision = same bucket for different keys`,`Chaining`,`Open addressing / probing`,`CPython dict uses open addressing`,`Resize at high load factor`,`O(1) average, O(n) worst`]},

function normalize(o) { const s = fresh(); if (o && typeof o === "object") for (const k in s) if (k in o) s[k] = o[k]; return s; }

// account sync via db capability (falls back to browser storage)
let REF = null, writing = false, pending = false, remoteTimer = null;
function scheduleRemote() { if (!REF) return; clearTimeout(remoteTimer); remoteTimer = setTimeout(pushRemote, 1200); }
async function pushRemote() {
  if (!REF) return;
  if (writing) { pending = true; return; }
  writing = true;
  try { await REF.set(JSON.parse(JSON.stringify(S))); setSync("Progress saved to your account"); }
  catch (e) { setSync("Saved in this browser"); }
  writing = false;
  if (pending) { pending = false; pushRemote(); }
}
function setSync(t) { $("#sync").textContent = t; }
async function initSync() {
  if (!window.claude || !window.claude.use) return;
  try {
    const [user, db] = await Promise.all([window.claude.use("user"), window.claude.use("db")]);
    if (!user || !db) return;
    const uid = await user.id();
    if (!uid) return;
    REF = db.doc("data/users/" + uid + "/progress");
    const snap = await REF.get();
    if (snap.exists) {
      const remote = JSON.parse(JSON.stringify(snap.data() || {}));
      if ((remote.updatedAt || 0) > (S.updatedAt || 0)) {
        S = normalize(remote);
        try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
        route();
      } else if ((S.updatedAt || 0) > (remote.updatedAt || 0)) pushRemote();
    } else if (S.updatedAt) pushRemote();

  } catch (e) { REF = null; }
}

const DAY = 864e5;
const rfKnown = () => RAPID.filter(r => S.rf[r.id] && S.rf[r.id].box >= 2).length;
const rfDue = () => RAPID.filter(r => !S.rf[r.id] || S.rf[r.id].due <= Date.now()).length;
function stats() {
  const py = Object.values(S.py).filter(v => v === "got").length;
  const dsa = Object.values(S.dsa).filter(v => v === "solved").length;
  const pat = Object.keys(S.pat).length;
  const rf = rfKnown();
  const qs = S.quiz.slice(-5); const quiz = qs.length ? Math.round(qs.reduce((a, q) => a + 100 * q.score / q.total, 0) / qs.length) : 0;
  const ms = S.mock.slice(-5); const mock = ms.length ? Math.round(ms.reduce((a, m) => a + m.avg * 10, 0) / ms.length) : 0;
  const p = {py: pct(py, PY.length), dsa: pct(dsa, DSA.length), pat: pct(pat, PATTERNS.length), rf: pct(rf, RAPID.length), quiz, mock};
  p.ready = Math.round(.22 * p.py + .22 * p.dsa + .14 * p.pat + .12 * p.rf + .16 * p.quiz + .14 * p.mock);
  return {py, dsa, pat, rf, p};
}
function weakAreas() {
  const w = {};
  const add = t => w[t] = (w[t] || 0) + 1;
  for (const id in S.wrong) { const q = QUIZ.find(x => x.id === id); if (q) add(q.tag); }
  for (const id in S.py) if (S.py[id] === "review") { const q = PY.find(x => x.id === id); if (q) add(q.tag); }
  for (const id in S.dsa) if (S.dsa[id] === "attempted") { const q = DSA.find(x => x.id === id); if (q) add(patName(q.pattern)); }
  return Object.entries(w).sort((a, b) => b[1] - a[1]);
}
function streak() {
  const set = new Set(S.days); let n = 0; const d = new Date();
  if (!set.has(today())) d.setDate(d.getDate() - 1);
  while (set.has(d.toLocaleDateString("en-CA"))) { n++; d.setDate(d.getDate() - 1); }
  return n;
}

const BOX_DAYS = [0, 0, 1, 3, 7, 14];
let FC = null;
ROUTES.flash = () => {

};
function fcStart(onlyDue) {
  const pool = onlyDue ? RAPID.filter(r => !S.rf[r.id] || S.rf[r.id].due <= Date.now()) : RAPID;
  FC = {queue: shuffle(pool).slice(0, 15), flipped: false, done: 0, known: 0};
  fcCard();
}
function fcCard() {
  if (!FC.queue.length) {
    view.innerHTML = head("Session complete") + `<div class="panel"><p>You reviewed ${FC.done} cards and knew ${FC.known} on the first try.</p><div class="row"><button class="btn pri" id="fcback">Back to flashcards</button><a class="btn" href="#/quiz">Take a quiz</a></div></div>`;
    $("#fcback").onclick = () => { FC = null; ROUTES.flash(); };
    return;
  }
  const c = FC.queue[0];
  view.innerHTML = `<div class="qprog"><span>${FC.queue.length} left in this session</span><button class="btn" id="fcend">End session</button></div>
  <button class="fc ${FC.flipped ? "back" : ""}" id="card" aria-live="polite"><div class="side-lab">${FC.flipped ? "Answer" : "Question · press Space or tap to flip"}</div><div>${FC.flipped ? c.a : c.q}</div></button>
  <div class="row" style="justify-content:center; margin-top:16px">${FC.flipped ? `<button class="btn bad" id="no">Didn't know (1)</button><button class="btn good" id="yes">Knew it (2)</button>` : `<button class="btn pri" id="flip">Show answer</button>`}</div>`;
  const flip = () => { FC.flipped = true; fcCard(); };
  $("#card").onclick = () => { if (!FC.flipped) flip(); };
  $("#flip") && ($("#flip").onclick = flip);
  $("#fcend").onclick = () => { FC = null; ROUTES.flash(); };
  const grade = ok => {
    const cur = S.rf[c.id] || {box: 0};
    const box = ok ? Math.min(5, Math.max(1, cur.box) + 1) : 1;
    S.rf[c.id] = {box, due: Date.now() + BOX_DAYS[box] * DAY};
    FC.queue.shift(); FC.done++;
    if (ok && !c._missed) FC.known++;
    if (!ok) { c._missed = true; FC.queue.push(c); }
    FC.flipped = false; save(); fcCard();
  };
  if ($("#yes")) { $("#yes").onclick = () => grade(true); $("#no").onclick = () => grade(false); }
  fcCard.key = e => {
    if (CUR !== "flash" || !FC || !FC.queue.length) return;
    if (e.target.matches("input, textarea")) return;
    if (!FC.flipped && (e.key === " " || e.key === "Enter")) { e.preventDefault(); flip(); }
    else if (FC.flipped && e.key === "1") grade(false);
    else if (FC.flipped && e.key === "2") grade(true);
  };
}
document.addEventListener("keydown", e => fcCard.key && fcCard.key(e));

const MOCK_BANK = [

function nextMockQ() {

  if (!pool.length) { s.cur = null; return; }
  let best = pool.filter(q => q.diff === s.level);
  if (!best.length) best = pool.slice().sort((a, b) => Math.abs(a.diff - s.level) - Math.abs(b.diff - s.level)).filter((q, _, arr) => Math.abs(q.diff - s.level) === Math.abs(arr[0].diff - s.level));
  s.cur = shuffle(best)[0]; s.asked.add(s.cur.id); s.phase = "ask"; s.result = null; s.followUp = null; s.draft = "";
}
function mockTurn() {

    <div>${r.strengths && r.strengths.length ? `<h3>What was good</h3><ul class="tight">${r.strengths.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : ""}

    ${r.inaccuracies && r.inaccuracies.length ? `<h3 style="margin-top:8px">Technical inaccuracies</h3><ul class="tight">${r.inaccuracies.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : ""}</div></div>
    ${r.better ? `<div class="sec"><h3>A stronger interview answer</h3><div class="callout good">${r.betterHtml ? r.better : esc(r.better)}</div></div>` : ""}
    <div class="row" style="margin-top:14px">${r.follow ? `<button class="btn pri" id="dofollow">Answer the follow-up</button>` : ""}<button class="btn ${r.follow ? "" : "pri"}" id="mnext">Next question</button></div>
    ${r.follow ? `<p class="muted small" style="margin-top:8px">Follow-up: ${esc(strip(r.follow))}</p>` : ""}</div>`;

}
function adjustLevel(score) { const s = MOCK.session; if (score >= 7) s.level = Math.min(3, s.level + 1); else if (score <= 3) s.level = Math.max(1, s.level - 1); }
async function aiGrade() {
  const s = MOCK.session, item = s.cur;
  const q = s.followUp || strip(item.q);
  const ref = s.followUp ? "None provided. Use your own expert knowledge of Python and data structures." :
    `Key points:\n- ${item.points.join("\n- ")}\nReference answer: ${strip(item.answer)}`;
  const prompt = `You are a senior software engineer running a Python and DSA technical interview. Grade the candidate's answer fairly and precisely, as a real interviewer would.

Question: ${q}

Reference for grading (the candidate has not seen this):
${ref}

Candidate's answer:
"""${s.draft}"""

"score": integer 0-10,
"verdict": one of "Strong", "Partly there", "Needs work",
"strengths": array of up to 3 short strings,
"missing": array of up to 4 short strings naming important points the answer left out,

  s.ctl = new AbortController();

    s.phase = "result"; mockTurn();

  const nums = s.scores.filter(x => typeof x === "number");
  const avg = nums.length ? nums.reduce((a, b) => a + b, 0) / nums.length : 0;
  if (nums.length) { S.mock.push({t: Date.now(), track: s.track === "py" ? "Python" : s.track === "dsa" ? "DSA" : "Mixed", n: nums.length, avg}); S.mock = S.mock.slice(-50); save(); }
  MOCK.session = null;
  view.innerHTML = head("Interview finished") + `<div class="panel">${nums.length ? `<div class="muted small">Average score</div><div class="score">${avg.toFixed(1)}/10</div><p>${nums.length} answer${nums.length === 1 ? "" : "s"} graded. ${avg >= 7 ? "Interview-ready on these topics." : avg >= 4 ? "Good foundation. Review the missing points and go again." : "Revise the most-asked questions, then try again."}</p>` : `<p>No answers were graded in this session.</p>`}
  <div class="row"><button class="btn pri" id="again">Start another interview</button><a class="btn" href="#/python">Review Python questions</a></div></div>`;
  $("#again").onclick = () => ROUTES.mock();
}

// ---------- MISTAKES ----------
ROUTES.mistakes = () => {
  const qw = QUIZ.filter(q => S.wrong[q.id]);
  const pr = PY.filter(q => S.py[q.id] === "review");
  const dr = DSA.filter(q => S.dsa[q.id] === "attempted");
  const none = !qw.length && !pr.length && !dr.length;
  view.innerHTML = head("Mistake review", "Everything you got wrong or flagged, in one place. Clear a quiz mistake by answering it correctly; clear a flag by marking the item as known.") +
  (none ? `<div class="panel empty">Nothing to review yet. Take a quiz or mark questions as "Needs review" and they'll appear here.<div style="margin-top:12px"><a class="btn pri" href="#/quiz">Take a quiz</a></div></div>` : `
  ${qw.length ? `<div class="panel"><div class="row" style="justify-content:space-between"><h2>Quiz questions you missed</h2><button class="btn pri" id="retry">Retry these</button></div>
    <ul class="reclist">${qw.map(q => `<li><span>${q.q}${q.code ? ` <span class="muted small">(code)</span>` : ""}</span><span class="tag">${esc(q.tag)}</span></li>`).join("")}</ul></div>` : ""}
  ${pr.length ? `<div class="panel"><h2>Python questions to review</h2><ul class="reclist">${pr.map(q => `<li><span>${q.q}</span><a class="btn" href="#/python/${q.id}">Open</a></li>`).join("")}</ul></div>` : ""}
  ${dr.length ? `<div class="panel"><h2>Problems to revisit</h2><ul class="reclist">${dr.map(q => `<li><span>${q.title}</span><a class="btn" href="#/dsa/${q.id}">Open</a></li>`).join("")}</ul></div>` : ""}`);
  const r = $("#retry"); if (r) r.onclick = () => { QZ = null; startQuiz("mistakes"); };
};

// ---------- LEARNING PATH ----------
ROUTES.path = () => {
  view.innerHTML = head("Learning path", "This first batch covers interview essentials across the whole syllabus. The full beginner-to-advanced modules below are being added in batches, each with the same Learn → Practice → Quiz → Interview → Revise flow.") +
  `<div class="panel"><h2>Available now</h2><p class="small">${PY.length} Python interview questions, ${DSA.length} DSA problems, ${PATTERNS.length} patterns, ${RAPID.length} rapid-fire questions, ${TRAPS.length} traps, ${QUIZ.length} quiz questions, flashcards and mock interviews.</p></div>
  <div class="pathcols"><div class="panel"><h2 style="margin-bottom:8px">Python modules</h2><ol>${PATH.python.map(m => `<li>${m} <span class="muted small">· planned</span></li>`).join("")}</ol></div>
  <div class="panel"><h2 style="margin-bottom:8px">DSA modules</h2><ol>${PATH.dsa.map(m => `<li>${m} <span class="muted small">· planned</span></li>`).join("")}</ol></div></div>`;
};

// ---------- SEARCH ----------
const INDEX = [
  ...PY.map(q => ({type: "Python question", title: strip(q.q), text: [q.topic, q.tag, q.answer, q.related.join(" ")].map(strip).join(" "), href: `#/python/${q.id}`})),
  ...DSA.map(d => ({type: "DSA problem", title: d.title, text: [patName(d.pattern), d.prompt, d.recognize].map(strip).join(" "), href: `#/dsa/${d.id}`})),
  ...PATTERNS.map(p => ({type: "Pattern", title: p.name, text: [p.signals.join(" "), p.idea, p.problems.join(" ")].map(strip).join(" "), href: `#/patterns/${p.id}`})),
  ...RAPID.map(r => ({type: "Rapid fire", title: strip(r.q), text: strip(r.a) + " " + r.tag, href: `#/rapid/${r.id}`})),
  ...TRAPS.map(t => ({type: "Trap", title: strip(t.title), text: t.tag + " " + strip(t.why) + " " + t.code, href: `#/traps/${t.id}`})),
  ...CX_TABLES.map(t => ({type: "Complexity table", title: `Complexity: ${t.name}`, text: t.rows.map(r => r.join(" ")).join(" "), href: "#/revise"})),
  {type: "Revision", title: "Python idioms for coding rounds", text: IDIOMS, href: "#/revise"},
  {type: "Revision", title: "How to answer a coding question", text: PLAN.map(p => p.join(" ")).join(" "), href: "#/revise"}
].map(e => ({...e, lt: e.title.toLowerCase(), lx: e.text.toLowerCase()}));
function search(q) {
  const terms = q.toLowerCase().split(/\s+/).filter(Boolean);
  if (!terms.length) return [];
  const full = q.toLowerCase().trim();
  return INDEX.map(e => {
    let sc = 0;
    for (const t of terms) { if (e.lt.includes(t)) sc += 6; else if (e.lx.includes(t)) sc += 1; else return null; }
    if (e.lt.includes(full)) sc += 10;
    if (e.lt.startsWith(full)) sc += 4;
    return {e, sc};
  }).filter(Boolean).sort((a, b) => b.sc - a.sc).map(x => x.e);
}
ROUTES.search = arg => {
  const res = search(arg || "");
  view.innerHTML = head(`Results for “${esc(arg)}”`, `${res.length} match${res.length === 1 ? "" : "es"}`) +
    (res.length ? `<div class="panel"><ul class="reclist">${res.map(r => `<li><span><span class="rt muted small">${r.type}</span><br>${esc(r.title)}</span><a class="btn" href="${r.href}">Open</a></li>`).join("")}</ul></div>`
      : `<div class="panel empty">Nothing matched. Try a shorter term, such as “dict”, “heap” or “closure”.</div>`);
};
const qin = $("#q"), resBox = $("#results");
let sel = -1;
function showResults() {
  const v = qin.value.trim();
  const r = search(v).slice(0, 8); sel = -1;
  if (!v) { resBox.classList.remove("open"); return; }
  resBox.innerHTML = r.length ? r.map((x, i) => `<a href="${x.href}" data-i="${i}"><div class="rt">${x.type}</div>${esc(x.title)}</a>`).join("") + `<a href="#/search/${encodeURIComponent(v)}"><div class="rt">All results</div>See every match for “${esc(v)}”</a>`
    : `<a href="#/search/${encodeURIComponent(v)}"><div class="rt">No quick matches</div>Search for “${esc(v)}”</a>`;
  resBox.classList.add("open");
}
qin.addEventListener("input", showResults);
qin.addEventListener("focus", showResults);
qin.addEventListener("keydown", e => {
  const links = $$("a", resBox);
  if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    e.preventDefault(); if (!links.length) return;
    sel = (sel + (e.key === "ArrowDown" ? 1 : -1) + links.length) % links.length;
    links.forEach((l, i) => l.classList.toggle("sel", i === sel));
  } else if (e.key === "Enter") {
    e.preventDefault();
    const target = sel >= 0 ? links[sel] : null;
    location.hash = target ? target.getAttribute("href") : `#/search/${encodeURIComponent(qin.value.trim())}`;
    resBox.classList.remove("open"); qin.blur();
  } else if (e.key === "Escape") { resBox.classList.remove("open"); qin.blur(); }
});
resBox.addEventListener("click", () => { resBox.classList.remove("open"); qin.value = ""; });
document.addEventListener("click", e => { if (!e.target.closest(".search")) resBox.classList.remove("open"); });
document.addEventListener("keydown", e => {
  if (e.key === "/" && !e.target.matches("input, textarea")) { e.preventDefault(); qin.focus(); }
});

// ---------- boot ----------
route();
initSync();
initSample();

</script>
</body>
